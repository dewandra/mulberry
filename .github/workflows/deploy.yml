name: Deploy to Staging

on:
  push:
    branches: [main]
  create:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Resolve version ───────────────────────────────────────────────
      - name: Resolve app version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(git describe --tags --always 2>/dev/null | sed 's/^v//')
            if [ -z "$VERSION" ]; then
              VERSION="1.0.0+$(git rev-parse --short HEAD)"
            fi
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      # ── Install PHP dependencies ──────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      # ── Build frontend assets ─────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # ── Deploy via FTP ────────────────────────────────────────────────
      - name: Deploy to server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/tests/**
            **/phpunit.xml
            **/.editorconfig
            **/README.md

      # ── Post-deploy: run artisan commands via webhook ─────────────────
      - name: Run post-deploy commands
        run: |
          echo "Calling deploy webhook..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.APP_URL }}/deploy-webhook.php?token=${{ secrets.DEPLOY_TOKEN }}&version=${{ steps.version.outputs.APP_VERSION }}")
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Post-deploy commands executed successfully"
          else
            echo "⚠️ Webhook returned HTTP $RESPONSE"
          fi
